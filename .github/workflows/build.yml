name: Siteyi oluştur
on:
  push:
    branches: [main]
    paths: ["data/**", "build.py", "tools/**", "kaynak/**", "assets/css/**", "assets/js/**", "_headers", ".github/workflows/**"]
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Görselleri hazırla
        run: |
          pip install --quiet "pillow>=11,<13"
          python3 tools/gorselleri_hazirla.py
      - name: Sayfaları oluştur
        run: python3 build.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Site yeniden oluşturuldu"
          git push
      - name: Yayın dalını güncelle (Cloudflare Pages yalnızca bu dalı yayınlar)
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/yayin && mkdir /tmp/yayin
          cp -r *.html ilce assets sitemap.xml robots.txt manifest.webmanifest sw.js favicon.ico _headers /tmp/yayin/
          rm -f /tmp/yayin/google*.html
          cd /tmp/yayin
          git init -q -b yayin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Yayın ${GITHUB_SHA::7}"
          URL="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q "$URL" yayin 2>/dev/null && [ "$(git rev-parse FETCH_HEAD^{tree})" = "$(git rev-parse HEAD^{tree})" ]; then
            echo "Yayın dosyaları değişmedi."
          else
            git push -qf "$URL" yayin && echo "Yayın dalı güncellendi."
          fi
