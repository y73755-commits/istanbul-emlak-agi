name: Siteyi oluştur
on:
  push:
    branches: [main]
    paths: ["data/**", "build.py", "tools/**", "assets/css/**", "assets/js/main.js", ".github/workflows/**"]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Görselleri indir
        run: python3 tools/gorselleri_indir.py
      - name: Sayfaları oluştur
        run: python3 build.py
      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Site yeniden oluşturuldu"
          git push
