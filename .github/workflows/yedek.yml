name: Veritabanı yedeği
run-name: "Veritabanı yedeği (${{ inputs.kaynak || github.event_name }})"
# Her gece şifreli yedek alır: Supabase veritabanı (kullanıcılar, talepler, üyelikler, ayarlar),
# kullanıcıların yüklediği profil fotoğrafları ve yapılandırma dosyaları (supabase/, data/, AYARLAR.md).
# Yedek, GitHub Actions "Artifacts" bölümünde 30 gün saklanır. Dosya AES-256 ile şifrelidir;
# açmak için YEDEK_PAROLASI gerekir (parola yalnızca sizde ve GitHub gizli değişkenlerinde durur).
#
# Kurulum (bir kez, siz yaparsınız):
#   GitHub > Settings > Secrets and variables > Actions > New repository secret
#   SUPABASE_DB_URL : Supabase > Connect > Session pooler bağlantı adresi (şifre dahil)
#   YEDEK_PAROLASI  : kendi belirlediğiniz uzun bir parola (kaybederseniz yedek açılamaz)
on:
  schedule:
    - cron: "41 0 * * *"      # her gece 03:41 (Türkiye saati); GitHub zamanlayıcısı gecikirse Cloudflare zamanlayıcısı da başlatır
  workflow_dispatch:
    inputs:
      kaynak:
        description: "Başlatan (elle / cloudflare-zamanlayici)"
        required: false
        default: "elle"
permissions:
  contents: read
concurrency:
  group: yedek
  cancel-in-progress: false
jobs:
  yedek:
    runs-on: ubuntu-latest
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PAROLA: ${{ secrets.YEDEK_PAROLASI }}
    steps:
      - uses: actions/checkout@v4
      - name: Ayar kontrolü
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PAROLA" ]; then
            echo "::warning::SUPABASE_DB_URL ve YEDEK_PAROLASI tanımlı değil; yedek alınmadı. Kurulum adımları yedek.yml dosyasının başında."
            echo "ATLA=1" >> "$GITHUB_ENV"
          elif [ "${#PAROLA}" -lt 20 ]; then
            echo "::warning::YEDEK_PAROLASI 20 karakterden kısa. Yedek yine alınıyor ama herkese açık depoda daha uzun bir parola önerilir."
          else
            echo "Yedek parolası uzunluk kontrolü: uygun."
          fi
      - uses: supabase/setup-cli@v1
        if: env.ATLA != '1'
        with:
          version: latest
      - name: Yedek al ve şifrele
        if: env.ATLA != '1'
        run: |
          set -euo pipefail
          # Gizli ayara yanlışlıkla eklenen boşluk/metin temizlenir (adres boşluk içeremez).
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '\r' | sed -E 's/^[[:space:]]+//; s/[[:space:]].*$//')"
          echo "::add-mask::$DB_URL"
          case "$DB_URL" in postgresql://*@*/postgres) ;; *) echo "::error::SUPABASE_DB_URL biçimi hatalı (postgresql://...@.../postgres olmalı)."; exit 1;; esac
          mkdir -p yedek
          supabase db dump --db-url "$DB_URL" -f yedek/roller.sql --role-only
          supabase db dump --db-url "$DB_URL" -f yedek/sema.sql
          supabase db dump --db-url "$DB_URL" -f yedek/veri.sql --use-copy --data-only
          # Yüklenen dosyalar: profil fotoğrafları (herkese açık "profil" deposu)
          SB_URL=$(python3 -c "import json;print(json.load(open('data/site.json',encoding='utf-8'))['supabase']['url'])")
          mkdir -p yedek/dosyalar/profil
          psql "$DB_URL" -At -c "select name from storage.objects where bucket_id = 'profil' order by name" > yedek/dosyalar/liste.txt
          n=0
          while IFS= read -r ad; do
            [ -n "$ad" ] || continue
            mkdir -p "yedek/dosyalar/profil/$(dirname "$ad")"
            yol=$(python3 -c "import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))" "$ad")
            curl -sf "$SB_URL/storage/v1/object/public/profil/$yol" -o "yedek/dosyalar/profil/$ad" && n=$((n+1))
          done < yedek/dosyalar/liste.txt
          echo "Dosya: $n / $(grep -c . yedek/dosyalar/liste.txt || true)"
          # Yapılandırma
          mkdir -p yedek/yapilandirma && cp -r supabase data yedek/yapilandirma/
          ls -la yedek
          tar czf yedek.tgz yedek
          AD="yedek-$(date -u +%Y%m%d-%H%M).tgz.gpg"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PAROLA" --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 --s2k-count 65011712 -o "$AD" yedek.tgz
          rm -rf yedek yedek.tgz
          echo "DOSYA=$AD" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        if: env.ATLA != '1'
        with:
          name: veritabani-yedegi
          path: ${{ env.DOSYA }}
          retention-days: 30
          if-no-files-found: error
