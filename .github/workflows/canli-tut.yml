name: Veritabanını canlı tut
# 1) Supabase ücretsiz projeleri 7 gün düşük etkinlikte duraklatılır. Bu iş akışı her gün
#    herkese açık paket listesini okuyarak (ücretsiz, gizli bilgi gerektirmez) projeyi etkin tutmaya çalışır.
#    Bu bir garanti değildir; proje yine de duraklarsa Supabase panelinden "Resume project" ile açılır.
# 2) GitHub, herkese açık depolarda 60 gün hiç değişiklik olmazsa zamanlanmış iş akışlarını (bu dosya,
#    gece yedeği, günlük derleme) kendiliğinden kapatır. Son değişiklik 45 günü geçtiyse bu iş akışı
#    depoya boş bir "etkinlik" kaydı ekler; böylece zamanlanmış işler kapanmaz. Site yeniden yayınlanmaz.
on:
  schedule:
    - cron: "23 6 * * *"
    - cron: "12 7 18 11 *"   # tek seferlik zamanlayıcı denemesi
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase'e istek gönder
        run: |
          URL=$(python3 -c "import json;d=json.load(open('data/site.json',encoding='utf-8'));print(d['supabase']['url'])")
          KEY=$(python3 -c "import json;d=json.load(open('data/site.json',encoding='utf-8'));print(d['supabase']['anahtar'])")
          KOD=$(curl -s -o /tmp/y.json -w "%{http_code}" "$URL/rest/v1/paketler?select=id&limit=1" -H "apikey: $KEY")
          echo "Yanıt kodu: $KOD"; head -c 200 /tmp/y.json; echo
          if [ "$KOD" != "200" ]; then echo "::error::Supabase yanıt vermedi (kod $KOD). Proje duraklamış olabilir: Supabase panelinde projeyi açıp 'Resume project' ile başlatın."; exit 1; fi
      - name: GitHub zamanlanmış işleri kapanmasın
        if: always()
        run: |
          SON=$(git log -1 --format=%ct)
          GUN=$(( ( $(date +%s) - SON ) / 86400 ))
          echo "Son değişiklikten bu yana: $GUN gün"
          if [ "$GUN" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Etkinlik kaydı: zamanlanmış iş akışları (yedek, canlı tutma) kapanmasın"
            git push
          fi
